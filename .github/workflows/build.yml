name: Build installers

on:
  push:
    branches: [main, master, claude/restart-project-pFuPK]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: List release files
        run: dir release

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: release/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG (x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Build macOS DMG (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: List release files
        run: ls -lh release/

      - name: Upload macOS DMGs
        uses: actions/upload-artifact@v4
        with:
          name: Mac-DMG
          path: release/*.dmg
          retention-days: 30

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Installer
          path: ./artifacts/windows

      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: Mac-DMG
          path: ./artifacts/mac

      - name: List downloaded files
        run: find ./artifacts -type f

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Dernière version — ${{ github.ref_name }}"
          prerelease: true
          files: |
            ./artifacts/windows/*.exe
            ./artifacts/mac/*.dmg
          body: |
            Build automatique — commit `${{ github.sha }}`

            **Mac** : télécharger le `.dmg`, double-cliquer, glisser `Node Organisation` dans Applications.
            - `*-x64.dmg` → Intel
            - `*-arm64.dmg` → Apple Silicon (M1/M2/M3)

            **Windows** : lancer le `.exe` et suivre l'assistant.

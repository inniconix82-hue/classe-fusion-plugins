name: Build installers

on:
  push:
    branches: [main, master, claude/restart-project-pFuPK]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: release/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: |
          npx electron-builder --mac zip --x64 --publish never
          npx electron-builder --mac zip --arm64 --publish never

      - name: Upload macOS ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: Mac-App
          path: release/*.zip
          retention-days: 30

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Dernière version — ${{ github.ref_name }}"
          prerelease: true
          files: |
            Windows-Installer/*.exe
            Mac-App/*.zip
          body: |
            Build automatique — commit `${{ github.sha }}`

            **Mac** : télécharger le `.zip` correspondant à votre Mac, dézipper, glisser `Node Organisation.app` dans Applications.
            - `*-mac.zip` → Intel (x64)
            - `*-arm64-mac.zip` → Apple Silicon (M1/M2/M3)

            **Windows** : lancer le `.exe` et suivre l'assistant.

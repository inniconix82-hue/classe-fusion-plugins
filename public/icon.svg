<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="64" fill="#1e293b"/>
  <g transform="translate(256,256)">
    <!-- Central hexagon -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#6366f1" opacity="0.9"/>
    <!-- Top node -->
    <circle cx="0" cy="-160" r="30" fill="#ec4899"/>
    <line x1="0" y1="-130" x2="0" y2="-80" stroke="#94a3b8" stroke-width="3"/>
    <!-- Right node -->
    <circle cx="140" cy="80" r="30" fill="#f97316"/>
    <line x1="69" y1="40" x2="110" y2="60" stroke="#94a3b8" stroke-width="3"/>
    <!-- Left node -->
    <circle cx="-140" cy="80" r="30" fill="#22c55e"/>
    <line x1="-69" y1="40" x2="-110" y2="60" stroke="#94a3b8" stroke-width="3"/>
    <!-- Bottom node -->
    <circle cx="0" cy="180" r="30" fill="#eab308"/>
    <line x1="0" y1="80" x2="0" y2="150" stroke="#94a3b8" stroke-width="3"/>
  </g>
</svg>
